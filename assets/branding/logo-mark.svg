<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="markDropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
    <linearGradient id="markRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4" />
    </linearGradient>
    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="200" height="200" rx="44" fill="#0B0E18" />
  
  <!-- Outer Shield / Hexagon -->
  <polygon points="100,15 175,58 175,142 100,185 25,142 25,58" fill="#131726" stroke="url(#markRingGrad)" stroke-width="4" />
  
  <!-- Precision Measuring Grid Lines -->
  <line x1="60" y1="75" x2="140" y2="75" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4" />
  <line x1="50" y1="100" x2="150" y2="100" stroke="#34D399" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
  <line x1="60" y1="125" x2="140" y2="125" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4" />
  
  <!-- Calibrated Water Drop & Probe Core -->
  <path d="M100,35 C100,35 145,95 145,125 C145,150 125,170 100,170 C75,170 55,150 55,125 C55,95 100,35 100,35 Z" fill="url(#markDropGrad)" />
  
  <!-- Inner Probe Electrode -->
  <circle cx="100" cy="130" r="18" fill="#0B0E18" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="100" cy="130" r="8" fill="#00E676" filter="url(#markGlow)" />
  
  <!-- Pulse Rings -->
  <path d="M78,105 A32,32 0 0,1 122,105" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <path d="M85,90 A45,45 0 0,1 115,90" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>
