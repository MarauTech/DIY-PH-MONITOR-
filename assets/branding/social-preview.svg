<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0B0E18" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bgGrad)" />

  <!-- Ambient background glow blobs -->
  <circle cx="200" cy="180" r="160" fill="#00F2FE" opacity="0.08" filter="url(#heroGlow)" />
  <circle cx="1080" cy="450" r="180" fill="#10B981" opacity="0.08" filter="url(#heroGlow)" />

  <!-- Grid Pattern overlay -->
  <g opacity="0.1">
    <line x1="0" y1="80" x2="1280" y2="80" stroke="#38BDF8" stroke-width="1" />
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#38BDF8" stroke-width="1" />
    <line x1="0" y1="240" x2="1280" y2="240" stroke="#38BDF8" stroke-width="1" />
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#38BDF8" stroke-width="1" />
    <line x1="0" y1="400" x2="1280" y2="400" stroke="#38BDF8" stroke-width="1" />
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#38BDF8" stroke-width="1" />
    <line x1="0" y1="560" x2="1280" y2="560" stroke="#38BDF8" stroke-width="1" />

    <line x1="160" y1="0" x2="160" y2="640" stroke="#38BDF8" stroke-width="1" />
    <line x1="320" y1="0" x2="320" y2="640" stroke="#38BDF8" stroke-width="1" />
    <line x1="480" y1="0" x2="480" y2="640" stroke="#38BDF8" stroke-width="1" />
    <line x1="640" y1="0" x2="640" y2="640" stroke="#38BDF8" stroke-width="1" />
    <line x1="800" y1="0" x2="800" y2="640" stroke="#38BDF8" stroke-width="1" />
    <line x1="960" y1="0" x2="960" y2="640" stroke="#38BDF8" stroke-width="1" />
    <line x1="1120" y1="0" x2="1120" y2="640" stroke="#38BDF8" stroke-width="1" />
  </g>

  <!-- Main Content Layout -->
  <!-- Left: Logo & Hero Info -->
  <g transform="translate(100, 140)">
    <!-- Main Logo Mark -->
    <g transform="translate(0, 0) scale(1.1)">
      <polygon points="60,10 105,36 105,86 60,112 15,86 15,36" fill="#131726" stroke="url(#glowGrad)" stroke-width="3" />
      <path d="M60,22 C60,22 87,58 87,76 C87,91 75,103 60,103 C45,103 33,91 33,76 C33,58 60,22 60,22 Z" fill="url(#glowGrad)" />
      <circle cx="60" cy="79" r="11" fill="#0B0E18" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="60" cy="79" r="5" fill="#00E676" />
    </g>

    <!-- Header Text -->
    <g transform="translate(150, 20)">
      <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
        Marau<tspan fill="#38BDF8">Tech</tspan>
      </text>
      <text x="2" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#34D399" letter-spacing="4">
        pH MONITOR
      </text>
      <rect x="235" y="65" width="80" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
      <text x="275" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#38BDF8" text-anchor="middle">v2.0.0</text>
    </g>

    <!-- Subtitle & Bullets -->
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#E2E8F0">
      Open Source ESP32 Precision pH System &amp; Native Android App
    </text>
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
      • 3-Point Calibration &amp; Stability Analysis  • Real-time Web Dashboard &amp; History
    </text>
    <text x="0" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
      • Home Assistant MQTT &amp; Pushover Alarms  • Jetpack Compose App &amp; Widgets
    </text>

    <!-- Badge Pills -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="130" height="36" rx="18" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="1.5" />
      <text x="65" y="23" font-family="sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="middle">ESP32 Core</text>

      <rect x="145" y="0" width="150" height="36" rx="18" fill="#38BDF8" opacity="0.15" stroke="#38BDF8" stroke-width="1.5" />
      <text x="220" y="23" font-family="sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">Android Native</text>

      <rect x="310" y="0" width="130" height="36" rx="18" fill="#818CF8" opacity="0.15" stroke="#818CF8" stroke-width="1.5" />
      <text x="375" y="23" font-family="sans-serif" font-size="13" font-weight="700" fill="#818CF8" text-anchor="middle">Material 3</text>
    </g>
  </g>

  <!-- Right: Glassmorphism Mockup Card Preview -->
  <g transform="translate(800, 110)">
    <!-- Phone / Dashboard Mockup Card -->
    <rect x="0" y="0" width="380" height="430" rx="28" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4" filter="url(#heroGlow)" />
    
    <!-- Top Notch & Header -->
    <rect x="140" y="12" width="100" height="12" rx="6" fill="#0B0E18" />
    <text x="30" y="60" font-family="sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">Akwarium Główne</text>
    <rect x="275" y="44" width="75" height="24" rx="6" fill="#10B981" opacity="0.2" stroke="#10B981" stroke-width="1" />
    <text x="312" y="60" font-family="sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">NORMAL</text>

    <!-- Main pH Display Card -->
    <g transform="translate(25, 85)">
      <rect x="0" y="0" width="330" height="150" rx="18" fill="#131726" stroke="#2D3748" stroke-width="1" />
      <text x="20" y="32" font-family="sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1">POZIOM pH</text>
      <text x="20" y="100" font-family="sans-serif" font-size="64" font-weight="900" fill="#38BDF8">7.21</text>
      <text x="175" y="70" font-family="sans-serif" font-size="22" font-weight="700" fill="#38BDF8">pH</text>
      <text x="20" y="130" font-family="sans-serif" font-size="12" font-weight="600" fill="#10B981">✓ Sonda: 2.642 V  (Skalibrowana)</text>
    </g>

    <!-- Secondary Metrics (Temp & Voltage) -->
    <g transform="translate(25, 250)">
      <rect x="0" y="0" width="155" height="80" rx="14" fill="#131726" stroke="#2D3748" stroke-width="1" />
      <text x="16" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#94A3B8">TEMPERATURA</text>
      <text x="16" y="58" font-family="sans-serif" font-size="24" font-weight="800" fill="#F8FAFC">24.5 <tspan font-size="16" fill="#F97316">°C</tspan></text>

      <rect x="175" y="0" width="155" height="80" rx="14" fill="#131726" stroke="#2D3748" stroke-width="1" />
      <text x="191" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#94A3B8">SYGNAŁ WiFi</text>
      <text x="191" y="58" font-family="sans-serif" font-size="24" font-weight="800" fill="#38BDF8">-64 <tspan font-size="14" fill="#94A3B8">dBm</tspan></text>
    </g>

    <!-- Quick Action / Status Bar -->
    <g transform="translate(25, 345)">
      <rect x="0" y="0" width="330" height="48" rx="12" fill="#38BDF8" opacity="0.15" stroke="#38BDF8" stroke-width="1" />
      <text x="165" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#38BDF8" text-anchor="middle">⚡ Aktywny Monitoring LAN</text>
    </g>
  </g>
</svg>
